# CitePilot Worker. database_id 是已创建的 citepilot D1，不是占位。
# 密钥不要写进本文件：本地用 .dev.vars，线上用 `wrangler secret put`。
"$schema" = "./node_modules/wrangler/config-schema.json"
name = "citepilot"
main = "worker/index.ts"
# wrangler 4.151.3 自带的 workerd 最新支持到 2026-10-19。写更晚的日期会让本地运行时拒绝启动。
compatibility_date = "2026-10-19"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
# 没有 route 时 workers.dev 默认开启。preview_urls 省略不会改掉已有的版本预览开关。
workers_dev = false
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[assets]
# 直接用本文件部署时 wrangler 要求 directory。值与 vite.config.ts 的 build.outDir 一致。
# `npm run deploy` 用的是 vite build 生成的 dist/client/citepilot/wrangler.json，里面的 directory 会改成客户端产物。
directory = "./dist/client"
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"

[[d1_databases]]
binding = "DB"
database_name = "citepilot"
database_id = "7a561eed-e972-444e-8341-e65764128b31"
migrations_dir = "migrations"

# 素材图片。本地 `npm run dev` 使用 Wrangler 的本地 R2。
# 线上首次部署前：`npx wrangler r2 bucket create citepilot-media`
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "citepilot-media"
