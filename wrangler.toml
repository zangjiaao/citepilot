# CitePilot Worker. database_id 是本地占位 UUID。
# 部署前运行 `wrangler d1 create citepilot`，把返回的 id 写回这里。
# 密钥不要写进本文件：本地用 .dev.vars，线上用 `wrangler secret put`。
"$schema" = "./node_modules/wrangler/config-schema.json"
name = "citepilot"
main = "worker/index.ts"
# wrangler 4.151.3 自带的 workerd 最新支持到 2026-10-19。写更晚的日期会让本地运行时拒绝启动。
compatibility_date = "2026-10-19"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true
# 没有 route 时 workers.dev 默认开启。preview_urls 省略不会改掉已有的版本预览开关。
workers_dev = false
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[assets]
not_found_handling = "single-page-application"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"

[[d1_databases]]
binding = "DB"
database_name = "citepilot"
database_id = "11111111-1111-4111-8111-111111111111"
migrations_dir = "migrations"
